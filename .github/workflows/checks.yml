name: Build, checks and portable packages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ffmpeg: ffmpeg
          - os: windows-latest
            rid: win-x64
            ffmpeg: ffmpeg.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/cache@v4
        with:
          path: .runtime/downloads
          key: ffmpeg-9.0-autobuild-2026-10-06-${{ matrix.rid }}
      - run: dotnet build Voxen.csproj --configuration Release --nologo
      - run: dotnet run --project Tests/Voxen.Checks.csproj --configuration Release
      - run: node Tests/audio.checks.mjs
      - run: node Tests/shortcuts.checks.mjs
      - run: node Tests/player-controls.checks.mjs
      - run: node Tests/tone.checks.mjs
      - run: node Tests/appearance.checks.mjs
      - run: python scripts/publish.py --rid ${{ matrix.rid }} --output artifacts/Voxen-${{ matrix.rid }}
      - run: dotnet run --project Tests/Voxen.Checks.csproj --configuration Release -- --native
        env:
          SDL_AUDIODRIVER: dummy
          VOXEN_FFMPEG_PATH: ${{ github.workspace }}/artifacts/Voxen-${{ matrix.rid }}/tools/ffmpeg/${{ matrix.ffmpeg }}
      - run: python scripts/package.py --rid ${{ matrix.rid }} --version 0.0.0-ci --input artifacts/Voxen-${{ matrix.rid }} --output artifacts/release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Voxen-${{ matrix.rid }}
          path: artifacts/Voxen-${{ matrix.rid }}/
          retention-days: 14
